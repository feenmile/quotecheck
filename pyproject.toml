[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "quotecheck-mcp"
version = "0.1.0"
description = "Verify that a quoted passage actually appears, word for word, in its cited source."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Feenmile" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["citations", "quotes", "verification", "mcp", "agents", "fact-checking"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
quotecheck = "quotecheck.cli:main"
quotecheck-mcp = "quotecheck.mcp_server:main"

[project.urls]
Homepage = "https://github.com/feenmile/quotecheck"
Source = "https://github.com/feenmile/quotecheck"

[tool.setuptools.packages.find]
include = ["quotecheck*"]
